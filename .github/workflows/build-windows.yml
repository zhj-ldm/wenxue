name: build-windows-noembed

# 专用于 Windows 无内置向量模型的安装包：
# - 从 aggrsearch 源码构建 Windows 版 aggrsearch.exe（auto 模式，模型缺失自动词法重排）
# - 不打包 bin/models，安装包体积更小
# - 手动触发，或推送到 win-no-embed 分支时构建
on:
  workflow_dispatch:
  push:
    branches:
      - win-no-embed

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 构建无向量模型的 aggrsearch.exe
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'aggrsearch-src'
          git clone --depth 1 https://github.com/zhj-ldm/aggrsearch.git $src
          Push-Location $src
          cargo build --release --locked
          Pop-Location
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item (Join-Path $src 'target\release\aggrsearch.exe') 'bin\aggrsearch.exe' -Force
          Remove-Item 'bin\models' -Recurse -Force -ErrorAction SilentlyContinue
          .\bin\aggrsearch.exe version
          .\bin\aggrsearch.exe models status

      - name: 搜索工具冒烟测试（无模型应自动词法重排）
        continue-on-error: true
        shell: pwsh
        run: |
          $env:AGGRSEARCH_EMBED = 'auto'
          .\bin\aggrsearch.exe search "rust async" --max 3 --json | Out-File -Encoding utf8 search.json
          $data = Get-Content search.json -Raw | ConvertFrom-Json
          Write-Host "results=$($data.results.Count) embedding_rerank=$($data._timing.stages.embedding_rerank)"
          if ($data._timing.stages.embedding_rerank -ne $false) { throw "无模型时应走词法重排" }

      - name: 安装依赖
        run: npm ci

      - name: 打包 Windows 安装包（不含模型）
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 校验安装包内容
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | Format-Table Name, Length
          if (-not (Test-Path dist\*.exe)) { throw "未生成安装包" }

      - name: 安装并启动冒烟测试
        continue-on-error: true
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          Write-Host "installer=$installer"
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          $exe = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\Wenxue\Wenxue.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\问学\问学.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "静默安装后未找到主程序" }
          Write-Host "exe=$exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "应用启动后退出，退出码 $($p.ExitCode)" }
          Write-Host "应用已启动并保持运行"
          Stop-Process -Id $p.Id -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wenxue-windows-x64-noembed
          path: dist/*.exe
          if-no-files-found: error
